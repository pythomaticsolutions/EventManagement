<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credentials Input</title>
    <style>
      :root {
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f6fb;
      }

      .card {
        width: min(360px, 92vw);
        padding: 24px;
        border-radius: 12px;
        background: white;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0 0 16px;
        font-size: 1.25rem;
      }

      label {
        display: block;
        margin: 10px 0 6px;
        font-size: 0.9rem;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border: 1px solid #c7d2e3;
        border-radius: 8px;
      }

      button {
        margin-top: 14px;
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: #2f6fed;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }

      .output {
        margin-top: 14px;
        font-size: 0.9rem;
        color: #1f2a44;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Enter Credentials</h1>
      <form id="credentials-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required />

        <button type="submit">Capture Values</button>
      </form>

      <div id="result" class="output" aria-live="polite"></div>
    </main>

    <script>
      const form = document.getElementById('credentials-form');
      const result = document.getElementById('result');

      form.addEventListener('submit', (event) => {
        event.preventDefault();

        const username = form.username.value;
        const password = form.password.value;

        result.textContent = `Captured username: ${username} | Captured password: ${password}`;
      });
    </script>
  </body>
</html>
